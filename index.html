<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sex</title>
</head>
<body>
    <h1>Sex</h1>
    <input type="text" id="user" placeholder="Логин">
    <input type="password" id="pass" placeholder="Пароль">
    <button onclick="doLogin()">Войти</button>
    <div id="result"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyCpxiZ3MOjwMUsPX8zuihHEkLobi2Nlc5GpW-eaQX9A7ufDuo-DcbSweL1V5c2aMFprw/exec';
        
        async function doLogin() {
            var username = document.getElementById('user').value;
            var password = document.getElementById('pass').value;
            
            const url = API_URL + '?action=login&username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password);
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                document.getElementById('result').innerText = JSON.stringify(result);
            } catch(e) {
                document.getElementById('result').innerText = 'Ошибка: ' + e;
            }
        }
    </script>
</body>
</html>
